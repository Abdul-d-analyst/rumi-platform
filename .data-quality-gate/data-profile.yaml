# Data Quality Gate — data-profile configuration.
# Global defaults for the profile comparison; a table-contract file
# (table-contracts/<table>.yaml) can override any of these per table/column.
# Malformed config (unknown keys at the top level, wrong types) fails
# validation — see .claude/skills/data-quality-gate/scripts/config.py:load_data_profile_config.

defaults:
  row_count_tolerance_pct: 10.0     # row count may move +/- this % vs baseline before WARN
  null_rate_tolerance_pct: 5.0      # a critical column's null% may move +/- this many points
  anomaly_method: "iqr"             # iqr | robust_zscore | psi
  anomaly_block: false              # per-table/per-column override required to actually block

# Tables with no contract file begin in WARN-only mode during the advisory
# rollout below. `enforce_after` is documented here, not enforced by code —
# a human decides when the rollout period is over and flips tables to
# enforcing by adding/completing their contract file.
advisory_rollout:
  started: "2026-09-15"
  enforce_after: "2026-10-31"
  note: >
    Tables without a table-contracts/<table>.yaml file are profiled and
    reported but never block on anomaly/profile findings until this date.
    Structural schema-gate findings (removed column, narrowed type, etc.)
    are NOT covered by this rollout — those block from day one regardless
    of contract presence, since they're deterministic and not profile-based.
