# Data Quality Gate — semantic schema + data-profile check, DISTINCT from a
# separate "Data Standards Gate" workflow (static textual DDL checks, no
# live database). Scripts live in this repo at .claude/skills/data-quality-gate
# and .claude/skills/data-standards (no external pack checkout needed).
#
# GitHub check name: data-quality-gate (job id below — what a repo admin
# selects under Settings -> Branches -> Require status checks).
#
# THIS FILE ONLY BECOMES A MERGE GATE ONCE A REPO ADMIN MARKS THE
# "data-quality-gate" JOB AS A REQUIRED STATUS CHECK. Copying this file in
# only makes the check RUN and REPORT — do not mark it required until an
# advisory rollout period has shown an acceptable false-positive rate
# against this repo's real migration history.
#
# What this workflow does:
#   1. scope_detect.py (stdlib-only, no services needed) decides whether
#      this PR touches anything schema-relevant at all. A NOT APPLICABLE
#      result returns fast without spinning up Postgres.
#   2. Two ephemeral Postgres 16 service containers (one per baseline/
#      proposed state) receive the base-branch and PR-head migrations from
#      dashboard/database/migrations/ via migrate.py, then gate.py
#      introspects both via information_schema/pg_catalog and produces the
#      full report.
#   3. Reports (JSON + Markdown) are uploaded as build artifacts and a PR
#      comment is posted/updated (never duplicated).
#   4. On a confirmed BLOCK, Slack is notified (best-effort, never blocks
#      the job on delivery failure) and a durable audit-log record is
#      appended + forwarded to the shared governance event stream.
#   5. On a "PASS WITH VERIFIED EVIDENCE" result (a .data-quality-gate/
#      change.yaml on the PR branch structurally matched the real diff),
#      a second Slack message is sent and the audit trail records the
#      verified-evidence pass.
#
# SLACK SETUP (optional; missing either secret is safe — notify.py reports
# "not sent" and never fails the job):
#   SLACK_BOT_TOKEN
#   TALEEMABAD_DATA_QUALITY_GATE_SLACK_CHANNEL
#
# BASELINE: the approved baseline is the current protected PR base-branch
# tip AT WORKFLOW STARTUP (github.event.pull_request.base.sha) — never
# git merge-base, which is used ONLY to scope which files changed for step 1
# above. The exact baseline SHA is threaded through to gate.py and appears
# in every report and Slack message.

name: Data Quality Gate

on:
  pull_request:
    types: [opened, reopened, synchronize]
  merge_group:
    types: [checks_requested]

jobs:
  data-quality-gate:
    name: data-quality-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    services:
      postgres_base:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: base_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      postgres_head:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: head_db
        ports: ["5433:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout (full history so scope detection can diff base..head)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Locate the data-quality-gate scripts
        id: pack
        run: |
          PACK_PATH=".claude/skills"
          if [ ! -f "$PACK_PATH/data-quality-gate/scripts/gate.py" ]; then
            echo "::error::Can't find gate.py under $PACK_PATH/data-quality-gate/scripts — did the skill move?"
            exit 2
          fi
          echo "path=$PACK_PATH/data-quality-gate" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r "${{ steps.pack.outputs.path }}/scripts/requirements.txt"
          sudo apt-get update -y && sudo apt-get install -y postgresql-client

      - name: Determine base/head refs (merge_group vs pull_request)
        id: refs
        run: |
          if [ "${{ github.event_name }}" = "merge_group" ]; then
            echo "base=${{ github.event.merge_group.base_sha }}" >> "$GITHUB_OUTPUT"
            echo "head=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "base=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
            echo "head=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Scope detection (cheap, stdlib-only — decides if the heavy pipeline runs at all)
        id: scope
        run: |
          set +e
          python3 "${{ steps.pack.outputs.path }}/scripts/scope_detect.py" \
            --config .data-quality-gate/scope.json \
            --git-diff "${{ steps.refs.outputs.base }}" "${{ steps.refs.outputs.head }}" \
            > scope.json
          code=$?
          cat scope.json
          applicable=$(python3 -c "import json; print(json.load(open('scope.json'))['applicable'])" 2>/dev/null || echo "ERROR")
          echo "applicable=$applicable" >> "$GITHUB_OUTPUT"
          if [ "$code" != "0" ]; then
            echo "::error::scope_detect.py itself failed (exit $code) — treating as NOT VERIFIED, not a silent pass."
            echo "applicable=ERROR" >> "$GITHUB_OUTPUT"
          fi

      # Everything below only runs when scope detection found something
      # relevant. A NOT APPLICABLE result is a fast, conclusive success —
      # not a skip that leaves the check status ambiguous.
      - name: Prepare base-branch worktree (for applying base migrations)
        if: steps.scope.outputs.applicable == 'True'
        run: |
          git worktree add /tmp/base-worktree "${{ steps.refs.outputs.base }}"

      - name: Apply base-branch migrations to postgres_base
        if: steps.scope.outputs.applicable == 'True'
        id: migrate_base
        run: |
          set +e
          cd /tmp/base-worktree
          MIGRATION_COMMAND="$(python3 -c "import json; print(json.load(open('${GITHUB_WORKSPACE}/.data-quality-gate/scope.json')).get('migration_command') or '')")"
          if [ -n "$MIGRATION_COMMAND" ]; then
            timeout 300 python3 "${GITHUB_WORKSPACE}/${{ steps.pack.outputs.path }}/scripts/migrate.py" \
              --dsn "postgresql://postgres:postgres@localhost:5432/base_db" \
              --migration-command "$MIGRATION_COMMAND"
          else
            timeout 300 python3 "${GITHUB_WORKSPACE}/${{ steps.pack.outputs.path }}/scripts/migrate.py" \
              --dsn "postgresql://postgres:postgres@localhost:5432/base_db" \
              --migrations-path "$(python3 -c "import json; print(json.load(open('${GITHUB_WORKSPACE}/.data-quality-gate/scope.json')).get('migrations_path','migrations'))")" \
              --file-glob "$(python3 -c "import json; print(json.load(open('${GITHUB_WORKSPACE}/.data-quality-gate/scope.json')).get('migration_file_glob','*.sql'))")"
          fi
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Apply PR-head migrations to postgres_head
        if: steps.scope.outputs.applicable == 'True'
        id: migrate_head
        run: |
          set +e
          MIGRATION_COMMAND="$(python3 -c "import json; print(json.load(open('.data-quality-gate/scope.json')).get('migration_command') or '')")"
          if [ -n "$MIGRATION_COMMAND" ]; then
            timeout 300 python3 "${{ steps.pack.outputs.path }}/scripts/migrate.py" \
              --dsn "postgresql://postgres:postgres@localhost:5433/head_db" \
              --migration-command "$MIGRATION_COMMAND"
          else
            timeout 300 python3 "${{ steps.pack.outputs.path }}/scripts/migrate.py" \
              --dsn "postgresql://postgres:postgres@localhost:5433/head_db" \
              --migrations-path "$(python3 -c "import json; print(json.load(open('.data-quality-gate/scope.json')).get('migrations_path','migrations'))")" \
              --file-glob "$(python3 -c "import json; print(json.load(open('.data-quality-gate/scope.json')).get('migration_file_glob','*.sql'))")"
          fi
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run the gate (schema diff + contract check + evidence check)
        if: steps.scope.outputs.applicable == 'True'
        id: gate
        run: |
          set +e
          if [ "${{ steps.migrate_base.outputs.exit_code }}" != "0" ] || [ "${{ steps.migrate_head.outputs.exit_code }}" != "0" ]; then
            echo '{"result":"ERROR","error":"one or both migration applications failed — failing closed rather than diffing an incomplete snapshot"}' > report.json
            echo "exit_code=2" >> "$GITHUB_OUTPUT"
          else
            python3 "${{ steps.pack.outputs.path }}/scripts/gate.py" \
              --base-dsn "postgresql://postgres:postgres@localhost:5432/base_db" \
              --head-dsn "postgresql://postgres:postgres@localhost:5433/head_db" \
              --baseline-sha "${{ steps.refs.outputs.base }}" \
              -o report.json
            echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          fi
          cat report.json

      - name: Upload report artifact (kept even on failure)
        if: always() && steps.scope.outputs.applicable == 'True'
        uses: actions/upload-artifact@v4
        with:
          name: data-quality-gate-report
          path: report.json
          retention-days: 30

      - name: Append durable audit-log record + forward to shared governance stream
        if: always() && steps.scope.outputs.applicable == 'True'
        run: |
          python3 - <<'PYEOF'
          import json, sys
          sys.path.insert(0, "${{ steps.pack.outputs.path }}/scripts")
          from audit_trail import append_audit_record, forward_to_governance
          from pathlib import Path

          try:
              report = json.load(open("report.json"))
          except Exception as e:
              report = {"result": "ERROR", "error": f"could not read report.json: {e}"}

          record = {
              "gate": "data-quality-gate",
              "repo": "${{ github.repository }}",
              "branch": "${{ github.head_ref || github.ref_name }}",
              "commit": "${{ steps.refs.outputs.head }}",
              "baseline_sha": "${{ steps.refs.outputs.base }}",
              "actor": "${{ github.actor }}",
              "pr": "${{ github.event.pull_request.html_url || '' }}",
              "result": report.get("result"),
          }
          print(append_audit_record(record, Path(".data-quality-gate/audit-log.jsonl")))

          findings = report.get("blocking_findings", [])
          issue_ids = []
          severity_counts = {}
          for f in findings:
              classification = f.get("classification") or f.get("kind") or "UNKNOWN"
              table = f.get("table", "")
              column = f.get("column")
              suffix = f"{table}.{column}" if column else table
              issue_ids.append(f"{classification}:{suffix}" if suffix else classification)
              severity_counts[classification] = severity_counts.get(classification, 0) + 1

          print(forward_to_governance(
              repo="${{ github.repository }}", branch="${{ github.head_ref || github.ref_name }}",
              head_sha="${{ steps.refs.outputs.head }}", base_sha="${{ steps.refs.outputs.base }}",
              result=report.get("result", "ERROR"), actor="${{ github.actor }}",
              pr="${{ github.event.pull_request.html_url || '' }}",
              changed_objects=[f.get("table","") for f in findings],
              issue_ids=issue_ids, severity_counts=severity_counts, report_ref=None,
          ))
          PYEOF

      - name: Commit the audit-log append (durable, tracked — never gitignored)
        if: always() && steps.scope.outputs.applicable == 'True'
        continue-on-error: true
        run: |
          if [ -f .data-quality-gate/audit-log.jsonl ]; then
            git config user.name "data-quality-gate[bot]"
            git config user.email "data-quality-gate-bot@users.noreply.github.com"
            git add .data-quality-gate/audit-log.jsonl
            git commit -m "data-quality-gate: audit log append for ${{ steps.refs.outputs.head }}" || echo "nothing to commit"
            git push origin "HEAD:${{ github.head_ref }}" || echo "::warning::could not push audit-log append — the artifact upload above is the durable record for this run regardless"
          fi

      - name: Notify Slack on a confirmed BLOCK
        if: steps.gate.outputs.exit_code == '1'
        continue-on-error: true
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          TALEEMABAD_DATA_QUALITY_GATE_SLACK_CHANNEL: ${{ secrets.TALEEMABAD_DATA_QUALITY_GATE_SLACK_CHANNEL }}
        run: |
          python3 "${{ steps.pack.outputs.path }}/scripts/notify.py" \
            --event block \
            --repo "${{ github.repository }}" \
            --pr "${{ github.event.pull_request.html_url || '' }}" \
            --branch "${{ github.head_ref || github.ref_name }}" \
            --commit "${{ steps.refs.outputs.head }}" \
            --actor "${{ github.actor }}" \
            --baseline-sha "${{ steps.refs.outputs.base }}" \
            --detected-change "see report.json artifact for full findings" \
            --risk "confirmed blocking schema/data-quality violation"

      - name: Notify Slack on PASS WITH VERIFIED EVIDENCE
        if: always() && steps.scope.outputs.applicable == 'True'
        continue-on-error: true
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          TALEEMABAD_DATA_QUALITY_GATE_SLACK_CHANNEL: ${{ secrets.TALEEMABAD_DATA_QUALITY_GATE_SLACK_CHANNEL }}
        run: |
          result=$(python3 -c "import json; print(json.load(open('report.json')).get('result',''))" 2>/dev/null || echo "")
          if [ "$result" = "PASS WITH VERIFIED EVIDENCE" ]; then
            python3 "${{ steps.pack.outputs.path }}/scripts/notify.py" \
              --event evidence_verified \
              --repo "${{ github.repository }}" \
              --pr "${{ github.event.pull_request.html_url || '' }}" \
              --branch "${{ github.head_ref || github.ref_name }}" \
              --commit "${{ steps.refs.outputs.head }}" \
              --actor "${{ github.actor }}" \
              --baseline-sha "${{ steps.refs.outputs.base }}" \
              --verification-result "structural match confirmed against real diff" \
              --audit-ref ".data-quality-gate/audit-log.jsonl @ ${{ steps.refs.outputs.head }}"
          fi

      - name: Post or update the PR comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body;
            const applicable = '${{ steps.scope.outputs.applicable }}';
            if (applicable === 'False') {
              body = '✅ **Data Quality Gate** — NOT APPLICABLE (no schema-relevant change detected).';
            } else if (applicable === 'ERROR') {
              body = '⚠️ **Data Quality Gate** — scope detection itself failed. Treating as NOT VERIFIED, not a silent pass.';
            } else {
              let report = {};
              try { report = JSON.parse(fs.readFileSync('report.json', 'utf8')); } catch (e) {}
              const result = report.result || 'ERROR';
              const headerByResult = {
                'PASS': '✅ **Data Quality Gate** — no blocking violations.',
                'PASS WITH VERIFIED EVIDENCE': '✅ **Data Quality Gate** — PASS WITH VERIFIED EVIDENCE (developer-submitted evidence matched the real diff; see report).',
                'FAIL': '❌ **Data Quality Gate** — confirmed blocking violation(s). See report artifact.',
                'ERROR': '⚠️ **Data Quality Gate** — the gate itself could not run. Treating as blocking rather than merging unverified.',
              };
              body = (headerByResult[result] || headerByResult['ERROR']) +
                `\n\n_Baseline SHA: \`${report.baseline_sha || 'unknown'}\`_` +
                `\n\n<details><summary>Full report (truncated)</summary>\n\n\`\`\`json\n${JSON.stringify(report, null, 2).slice(0, 6000)}\n\`\`\`\n\n</details>` +
                `\n\n_Full artifact: see the "data-quality-gate-report" build artifact on this run._`;
            }
            const marker = '<!-- data-quality-gate-comment -->';
            body = marker + '\n' + body;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
            }

      - name: Gate on the result
        run: |
          applicable="${{ steps.scope.outputs.applicable }}"
          if [ "$applicable" = "False" ]; then
            echo "No schema-relevant change detected — NOT APPLICABLE, passing."
            exit 0
          fi
          if [ "$applicable" = "ERROR" ]; then
            echo "::error::Scope detection itself failed — failing closed."
            exit 1
          fi
          code="${{ steps.gate.outputs.exit_code }}"
          if [ "$code" = "0" ]; then
            echo "Data Quality Gate passed."
            exit 0
          fi
          echo "::error::Data Quality Gate did not pass (gate.py exit $code) — see the report artifact and PR comment."
          exit 1
