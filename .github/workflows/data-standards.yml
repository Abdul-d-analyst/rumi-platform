# Data Standards CI gate — copy this into your repo as
# .github/workflows/data-standards.yml, then configure it as a REQUIRED
# branch-protection status check (Settings → Branches → your protected
# branch → Require status checks → select this workflow's job name).
#
# THIS FILE ONLY BECOMES AN ENFORCEMENT GATE ONCE THAT BRANCH-PROTECTION
# STEP IS DONE BY A REPO ADMIN. Copying this file in, by itself, only means
# the check RUNS and reports its result — it does not yet BLOCK a merge
# until an admin marks it required. Do not tell anyone "the gate is live"
# until that configuration step is confirmed done.
#
# What this workflow does (mirrors reference/enforcement-policy.md exactly —
# same shared validator as the Claude PreToolUse gate and the local Git
# hooks, so all three layers can never disagree about what's a violation):
#   - Runs on: pull_request (schema-related PRs), push to protected branches,
#     and workflow_dispatch (manual re-audit).
#   - Fetches enough Git history to diff base..head properly (a shallow
#     clone can't compute a real merge-base diff).
#   - Runs scripts/validate_schema.py --mode diff --base <merge-base> --head
#     <head-sha>.
#   - Uploads the JSON/Markdown report as a build artifact (kept even on
#     failure, so a reviewer can see exactly what was checked).
#   - Posts (or updates, never duplicates) ONE PR comment with the result.
#   - Notifies Slack on a confirmed violation, mirroring what the Claude
#     gate already does for its own commits — so a violation caught in CI
#     (e.g. from a plain terminal commit, or any PR the Claude gate never
#     saw) reaches the Data Team the same way. Best-effort only: a missing
#     SLACK_BOT_TOKEN/channel secret, or the Slack API being unreachable,
#     never fails the job — see the "Notify Slack" step below for exactly
#     what is and isn't required.
#   - Fails the job on exit code 1 (confirmed violation) OR exit code 2
#     (validator error) — a validator that couldn't run must never be
#     silently treated as "passed." Exit code 3 (no schema-relevant change)
#     and exit code 0 (pass) both succeed the job.
#
# Adjust `PACK_PATH` below to wherever this skills pack is available in your
# CI environment (a submodule, a separate checkout step, or vendored copy) —
# this template does not assume any particular way of getting
# scripts/validate_schema.py onto the runner, since that depends on how your
# organization distributes this pack internally.
#
# SLACK SETUP FOR THIS WORKFLOW (separate from the Claude-gate's .env):
# a CI runner does not check out this pack's .env (it's gitignored on
# purpose), so the "configure once in .env, works everywhere" story that
# applies inside a Claude session does NOT extend to CI automatically. Add
# two repository secrets — Settings → Secrets and variables → Actions →
# New repository secret — using EXACTLY these two names, because they are
# the literal environment variables notify.py/slack_send.py already read:
#   SLACK_BOT_TOKEN                          the same bot token from TOKENS.md
#   TALEEMABAD_DATA_STANDARDS_SLACK_CHANNEL  the channel ID to post to
# The "Notify Slack" step below exports both as env vars for that one step,
# which is enough — slack_send.py's _load_env() only fills a variable that
# ISN'T already set, so setting them directly here means no .env lookup
# happens at all in CI, and none is needed. If either secret is absent, the
# step still runs but notify.py reports "no channel configured" / "Slack
# token unavailable" and exits 0 — same never-block guarantee as everywhere
# else this script is called.

name: Data Standards Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  data-standards:
    name: data-standards / validate-schema
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write   # needed only for the PR-comment step below

    steps:
      - name: Checkout (full history for a real base..head diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # This repo vendors the skills directly at .claude/skills (see the
      # data-quality-gate workflow for the same pattern) — no external
      # checkout of agent-skills-taleemabad needed.
      - name: Locate the data-standards validator
        id: pack
        run: |
          PACK_PATH=".claude/skills"
          if [ ! -f "$PACK_PATH/data-standards/scripts/validate_schema.py" ]; then
            echo "::error::Can't find validate_schema.py under $PACK_PATH/data-standards/scripts — did the skill move?"
            exit 2
          fi
          echo "path=$PACK_PATH/data-standards" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validator dependencies
        run: pip install pyyaml

      - name: Determine base/head SHAs
        id: refs
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "base=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
            echo "head=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # github.event.before is a push-only field — it's empty for a manual
            # dispatch, which validate_schema.py's --mode diff then rejects
            # outright ("requires --base and --head"). A manual re-audit's most
            # sensible comparison is against the previous commit on this ref.
            echo "base=$(git rev-parse HEAD~1)" >> "$GITHUB_OUTPUT"
            echo "head=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "base=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
            echo "head=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Run the shared validator (diff mode)
        id: validate
        run: |
          set +e
          python3 "${{ steps.pack.outputs.path }}/scripts/validate_schema.py" \
            --mode diff --base "${{ steps.refs.outputs.base }}" --head "${{ steps.refs.outputs.head }}" \
            > report.json 2> report.err
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat report.json
          cat report.err >&2 || true
          # Also render the Markdown form for the PR comment / artifact.
          python3 "${{ steps.pack.outputs.path }}/scripts/validate_schema.py" \
            --mode diff --base "${{ steps.refs.outputs.base }}" --head "${{ steps.refs.outputs.head }}" \
            --markdown > report.md 2>> report.err || true
          exit 0   # this step always "succeeds" — the real pass/fail gate is the next step,
                   # so the artifact-upload step below still runs even on a validator failure

      - name: Validate the report itself is well-formed
        if: steps.validate.outputs.exit_code == '0' || steps.validate.outputs.exit_code == '1'
        run: |
          python3 "${{ steps.pack.outputs.path }}/scripts/validate_schema.py" \
            --mode validate-report report.json || true
          # Non-fatal here by design: report.json from --mode diff/staged/full is the
          # findings list shape validate_schema.py itself emits, not the fuller
          # audit-report-format.md issue shape validate-report expects — this step is a
          # structural sanity spot-check, not a blocking requirement, until this
          # template is adapted to emit the full issue-record shape end to end.

      - name: Upload report artifact (kept even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-standards-report
          path: |
            report.json
            report.md
          retention-days: 30

      - name: Post or update the PR comment
        if: github.event_name == 'pull_request' && always()
        # continue-on-error: a pull_request event from a fork always gets a
        # read-only GITHUB_TOKEN on the base repo regardless of the
        # `permissions:` block above (GitHub Actions security default) —
        # confirmed live against this same repo's data-quality-gate workflow
        # (Orenda-Project/rumi-platform#101, a genuine cross-fork PR). The
        # report artifact and "Gate on the validator's result" already fully
        # gate the PR either way; a missing inline comment on a fork PR is a
        # cosmetic gap, not a blocking one.
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const exitCode = '${{ steps.validate.outputs.exit_code }}';
            let body;
            try {
              const md = fs.readFileSync('report.md', 'utf8');
              const header = exitCode === '3'
                ? '✅ **Data Standards** — no schema-relevant changes detected.'
                : exitCode === '0'
                ? '✅ **Data Standards** — no blocking violations.'
                : exitCode === '1'
                ? '❌ **Data Standards** — confirmed blocking violation(s). See below.'
                : '⚠️ **Data Standards** — the validator itself could not run. Treating as blocking rather than silently passing.';
              body = `${header}\n\n<details><summary>Full report</summary>\n\n${md}\n\n</details>\n\n_Full artifact: see the "data-standards-report" build artifact on this run._`;
            } catch (e) {
              body = '⚠️ **Data Standards** — could not read the report file. Treat as blocking.';
            }
            const marker = '<!-- data-standards-gate-comment -->';
            body = marker + '\n' + body;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body,
              });
            }

      # Only on a CONFIRMED violation (exit 1) — matches the Claude gate's own
      # validation_failure event exactly, so the Data Team sees one consistent
      # "this is a real blocking finding" signal regardless of which layer
      # caught it. Deliberately NOT sent on exit 2 (validator error): that is
      # a build/infra problem for whoever's watching CI, not a data-standards
      # finding, and paging the Data Team for it would train them to ignore
      # this channel. CI has no bypass mechanism of its own (see the
      # "Manual setup" note at the bottom of this file on why a bypass here
      # belongs at branch-protection level, not an env var) — so there is no
      # separate "bypass" event to send from this workflow, unlike the
      # Claude gate which has both.
      #
      # `github.actor` is who pushed/opened the PR, not a "fixed" concept of
      # authorship (a rebase or a bot merge can differ from the original
      # committer) — good enough for "who to ask," which is this notification's
      # only job. Backgrounding is unnecessary here (unlike the bash gate hook,
      # which backgrounds notify.py to avoid adding latency to a live git
      # command) — a GitHub Actions step already runs asynchronously from the
      # contributor's own terminal, so there is nothing to protect by not
      # waiting on it. `continue-on-error: true` gives the equivalent
      # never-block guarantee instead: even if this step somehow fails outright
      # (not just "not sent" — an actual crash), the job's real pass/fail
      # verdict still comes only from the "Gate on the validator's result"
      # step below, never from whether Slack delivery succeeded.
      - name: Notify Slack on a confirmed violation
        if: steps.validate.outputs.exit_code == '1'
        continue-on-error: true
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          TALEEMABAD_DATA_STANDARDS_SLACK_CHANNEL: ${{ secrets.TALEEMABAD_DATA_STANDARDS_SLACK_CHANNEL }}
        run: |
          python3 "${{ steps.pack.outputs.path }}/scripts/notify.py" slack \
            --event validation_failure \
            --repo "${{ github.repository }}" \
            --branch "${{ github.head_ref || github.ref_name }}" \
            --commit "${{ steps.refs.outputs.head }}" \
            --actor "${{ github.actor }}" \
            --result "FAIL (CI)" \
            --pr "${{ github.event.pull_request.html_url || '' }}"

      # Forwards to the shared governance ingestion path (see notify.py's own
      # docstring) — deriving real issue_ids/severity_counts from the
      # validator's actual findings instead of leaving them empty. Runs on
      # every outcome (0/1/2/3), not just a confirmed failure, so the
      # governance stream also sees clean passes and no-schema-change runs —
      # useful for adoption/volume numbers, not only failure tracking.
      # TALEEMABAD_GOVERNANCE_ENDPOINT/TELEMETRY_KEY being unset is safe: the
      # sender falls back to a local file rather than failing the job.
      - name: Forward to the shared governance stream
        if: always() && (steps.validate.outputs.exit_code == '0' || steps.validate.outputs.exit_code == '1' || steps.validate.outputs.exit_code == '3')
        continue-on-error: true
        env:
          TALEEMABAD_GOVERNANCE_ENDPOINT: ${{ secrets.TALEEMABAD_GOVERNANCE_ENDPOINT }}
          TELEMETRY_KEY: ${{ secrets.TELEMETRY_KEY }}
        run: |
          python3 - <<'PYEOF'
          import json, subprocess, sys

          try:
              report = json.load(open("report.json"))
          except Exception:
              report = {"result": "ERROR", "findings": []}

          exit_code = "${{ steps.validate.outputs.exit_code }}"
          result_by_code = {"0": "PASS", "1": "FAIL", "2": "ERROR", "3": "PASS (no schema-relevant change)"}
          result = result_by_code.get(exit_code, "ERROR")

          findings = report.get("findings", [])
          confirmed = [f for f in findings if f.get("confirmed")]
          # "table" is None for file-level findings (e.g. D8's duplicate-
          # migration/destructive-statement checks aren't tied to one
          # table) — fall back to "path" (always present) so no issue_id
          # ever collapses to a bare "D8:".
          issue_ids = [f"{f.get('standard','UNKNOWN')}:{f.get('table') or f.get('path','')}" for f in confirmed]
          severity_counts = {}
          for f in confirmed:
              std = f.get("standard", "UNKNOWN")
              severity_counts[std] = severity_counts.get(std, 0) + 1

          cmd = [
              sys.executable, "${{ steps.pack.outputs.path }}/scripts/notify.py", "governance",
              "--repo", "${{ github.repository }}",
              "--branch", "${{ github.head_ref || github.ref_name }}",
              "--head-sha", "${{ steps.refs.outputs.head }}",
              "--base-sha", "${{ steps.refs.outputs.base }}",
              "--actor", "${{ github.actor }}",
              "--result", result,
          ]
          pr_url = "${{ github.event.pull_request.html_url || '' }}"
          if pr_url:
              cmd += ["--pr", pr_url]
          if issue_ids:
              cmd += ["--issue-ids", ",".join(issue_ids)]
          if severity_counts:
              cmd += ["--severity-counts", json.dumps(severity_counts)]

          proc = subprocess.run(cmd, capture_output=True, text=True)
          print(proc.stdout)
          print(proc.stderr, file=sys.stderr)
          PYEOF

      - name: Gate on the validator's result
        run: |
          code="${{ steps.validate.outputs.exit_code }}"
          if [ "$code" = "1" ]; then
            echo "::error::Confirmed blocking violation(s) — see the report artifact and PR comment."
            exit 1
          fi
          if [ "$code" = "2" ]; then
            echo "::error::The validator itself could not run — failing closed rather than merging unverified."
            exit 1
          fi
          echo "Data standards check passed (exit $code: 0=pass, 3=no schema-relevant change)."
          exit 0

# --- Manual setup this workflow does NOT do for you ---
#
# 1. Copy this file to .github/workflows/data-standards.yml in the target repo.
# 2. Set PACK_PATH (see the "Locate the data-standards validator" step) to
#    wherever your org makes agent-skills-taleemabad available in CI.
# 3. Go to Settings → Branches → (your protected branch) → Require status
#    checks to pass before merging → select "data-standards / validate-schema".
#    This step is what actually makes the check a merge gate — everything
#    above this line only makes it RUN and REPORT.
# 4. If your repo uses a bypass/override process for genuine incident work,
#    wire it as a protected label or a required-reviewer override at the
#    branch-protection level — NOT as an environment variable any
#    contributor could set (that's fine for local/Claude-session use, per
#    reference/enforcement-policy.md, but not for CI).
# 5. Optional but recommended: add the SLACK_BOT_TOKEN and
#    TALEEMABAD_DATA_STANDARDS_SLACK_CHANNEL repository secrets (Settings →
#    Secrets and variables → Actions) so the "Notify Slack on a confirmed
#    violation" step actually delivers. Skipping this is safe — the step
#    still runs and simply reports "not sent" — but it means the Data Team
#    will not hear about anything this CI check catches unless someone
#    checks the PR comment by hand.
